[project]
name = "price-history"
version = "0.1.1"
description = "Price history and current offers across stores from Google Shopping, via SerpApi, with a deal verdict, built for LLM agents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Simi24", email = "74307062+Simi24@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[project.scripts]
price-history = "price_history.cli:main"
price-history-mcp = "price_history.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
